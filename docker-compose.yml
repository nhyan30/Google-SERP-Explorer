# =============================================================================
# docker-compose.yml — runs the entire solution for local development.
# =============================================================================
# Brings up the app on http://localhost:3000 and (optionally) a one-shot
# `test` service that runs the Jest unit tests.
#
# Usage:
#   docker compose up        # start the app at http://localhost:3000
#   docker compose run test  # run the unit tests once
#   docker compose down      # stop & remove containers
# =============================================================================

services:
  app:
    build:
      context: .
      target: runner
    container_name: serp-explorer
    ports:
      - "3000:3000"
    environment:
      # ---- Provider selection -------------------------------------------------
      # Leave these blank to use the built-in z-ai SDK web search.
      # Uncomment + fill in to switch to real Google SERP data.
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot service that runs the Jest unit tests in a clean container.
  test:
    build:
      context: .
      target: test
    container_name: serp-explorer-test
    command: ["bun", "run", "test"]
    profiles: ["test"]
